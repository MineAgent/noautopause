plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.version
group = project.group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
}

dependencies {
	// Minecraft 26.1+ ships unobfuscated (official names), so Loom needs no `mappings` dependency.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	// Only the loader is needed: this mod does not use the Fabric API. The pause flag is cleared
	// from a mixin on Minecraft#tick instead of a ClientTickEvents listener, so fabric-api is not a
	// dependency of this mod.
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

processResources {
	def modVersion = project.version
	inputs.property "version", modVersion

	filesMatching("fabric.mod.json") {
		expand "version": modVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
	withSourcesJar()
}

tasks.named('jar') {
	// Reproducible archives.
	preserveFileTimestamps = false
	reproducibleFileOrder = true

	// NoAutoPauseMod reports this in the log, so the loaded build is identifiable.
	manifest {
		attributes(
				'Implementation-Title': 'NoAutoPause',
				'Implementation-Version': project.version
		)
	}
}

// Minecraft 26.1+ is unobfuscated, so the plain jar is the loadable one. If a Loom version does
// provide a remapJar, name it consistently.
tasks.matching { it.name == 'remapJar' }.configureEach {
	archiveFileName = "noautopause-${project.version}.jar"
}
